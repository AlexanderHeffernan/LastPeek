<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>X composer test fixture</title>
<style>
  :root{color-scheme:dark}body{margin:0;background:#000;color:#e7e9ea;font:16px -apple-system,BlinkMacSystemFont,sans-serif}nav{padding:20px;color:#71767b}#composer{width:560px;margin:24px auto;padding:24px;border:1px solid #2f3336;border-radius:16px;background:#131313}.post{padding:12px 0 24px;display:flex;gap:12px}.avatar{background:#264c70;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex-shrink:0}.body{flex:1;min-width:0}[contenteditable]{min-height:45px;font-size:20px;outline:0}[data-testid=toolBar]{display:flex;justify-content:space-between;border-top:1px solid #2f3336;padding-top:14px}button{font:inherit;cursor:pointer}.tools{display:flex}.tools button{background:transparent;border:0;color:#1d9bf0;width:36px;height:36px;font-size:20px}[data-testid=tweetButton]{border:0;background:#eff3f4;color:#0f1419;border-radius:24px;padding:8px 18px;font-weight:700}.body img{width:100%;margin-top:12px;border-radius:16px}.fixture{font-size:12px;text-align:center;color:#71767b}
  .tools button{border-radius:50%;transition:background-color .2s}.tools button:hover{background-color:color-mix(in srgb,currentColor 10%,transparent)}
</style></head><body>
<nav><button data-testid="SideNav_AccountSwitcher_Button">Alexander<br>@hefferalex</button></nav>
<div hidden id="background-composer"><div contenteditable="true" data-testid="tweetTextarea_0">Do not include this other draft</div><button data-testid="tweetButtonInline">Post</button></div>
<main id="composer" role="dialog">
  <div role="progressbar" aria-valuenow="0" aria-valuemax="100"><div data-testid="progressBar-bar"></div></div>
  <div data-testid="countdown-circle"><div role="progressbar" aria-valuenow="1" aria-valuemax="100"></div></div>
  <div class="post"><span class="avatar">A</span><div class="body">
    <div contenteditable="true" data-testid="tweetTextarea_0"><div data-block="true">A first post with an attachment.</div><div data-block="true"><br></div><div data-block="true">A separate paragraph — with an emoji 👩🏽‍💻.</div></div>
    <div data-testid="attachments"><img id="first-image" alt="A blue sample attachment"></div>
  </div></div>
  <div class="post"><span class="avatar">A</span><div class="body">
    <div contenteditable="true" data-testid="tweetTextarea_1"><div data-block="true">This is the follow-up reply, not part of the first post.</div></div>
  <div data-testid="toolBar"><div class="tools"><button data-testid="fileInputButton" aria-label="Add photos or video">▧</button><button aria-label="Add a GIF">GIF</button><button data-testid="createPollButton" aria-label="Add poll">☷</button><button aria-label="Add emoji">☺</button></div><button data-testid="tweetButton">Post all</button></div>
  </div></div>
</main><p class="fixture">COMPOSER FIXTURE · NOT LIVE X</p>
<script>
  const canvas = document.createElement('canvas'); canvas.width=640; canvas.height=320;
  const context = canvas.getContext('2d'); context.fillStyle='#164c71'; context.fillRect(0,0,640,320);
  context.fillStyle='#7dd3fc'; context.font='bold 34px -apple-system'; context.fillText('An embedded attachment',40,155);
  context.fillStyle='#e0f2fe'; context.font='20px -apple-system'; context.fillText('This image travels inside the HTML file.',40,200);
  document.querySelector('#first-image').src=canvas.toDataURL('image/png');
</script>
<script src="/extension/preview.js"></script><script src="/extension/capture.js"></script><script src="/extension/content.js"></script>
</body></html>
