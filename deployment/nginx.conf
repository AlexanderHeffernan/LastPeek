worker_processes 1;
pid /var/run/nginx.pid;
# Reloaded workers finish existing requests before the old app is stopped.
worker_shutdown_timeout 300s;
# nginx request-error logs can contain private review capability URLs too.
# Use updater health/configuration checks for diagnostics, not raw request logs.
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    # Reload closes idle keep-alive sockets, racing a client's next request.
    # Only the private tunnel-to-proxy hop reconnects; browser TLS stays at Cloudflare.
    keepalive_timeout 0;
    map $status $asset_cache_control {
        default "no-store";
        ~^[23] "public, max-age=31536000, immutable";
    }
    include /etc/lastpeek/active.conf;
    server {
        listen 3000;
        client_max_body_size 55m;
        location /_app/immutable/ {
            alias /srv/assets/;
            add_header Cache-Control $asset_cache_control always;
        }
        location / {
            proxy_pass http://lastpeek;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            # The tunnel is the sole public ingress. Do not trust arbitrary
            # forwarded client addresses if this network boundary changes.
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_buffering off;
            proxy_read_timeout 300s;
            # Never replay a write to a different app after an upstream error.
            proxy_next_upstream off;
        }
    }
}
