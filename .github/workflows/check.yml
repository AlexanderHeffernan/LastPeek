name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR updates replace their previous validation. Main commits validate/build
  # independently; only updating the mutable release tag is serialized below.
  group: lastpeek-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
      playwright: ${{ steps.plan.outputs.playwright }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --log-opts='--all --full-history' .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release-policy.mjs plan "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Check documentation-only changes
        if: steps.plan.outputs.runtime == 'false'
        run: npm ci && npm run format:check

  check:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Lockfile-selected browser image avoids installing WebKit's OS dependencies
    # and downloading both browser engines on every fresh runner.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.plan.outputs.playwright }}-noble
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: lastpeek
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lastpeek_test
        options: >-
          --health-cmd "pg_isready -U lastpeek -d lastpeek_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://lastpeek:ci-only@postgres:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Trust the container-mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm run verify:release -- --force

  deployment:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Real local Docker/nginx and disposable app/registry fixtures. No Pi access.
      # Match the root-owned gateway's identity and retain the selected Node version.
      - run: sudo env "PATH=$PATH" npm run test:deployment

  build:
    needs: [check, deployment]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'AlexanderHeffernan/LastPeek'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/alexanderheffernan/lastpeek:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            ORIGIN=https://lastpeek.alexheffernan.dev
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=lastpeek-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lastpeek-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: lastpeek-promote-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for a superseding application commit
        id: current
        run: |
          git fetch origin main
          node scripts/release-policy.mjs promote "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Publish the checked multi-architecture release
        if: steps.current.outputs.promote == 'true'
        env:
          IMAGE: ghcr.io/alexanderheffernan/lastpeek
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest" \
            "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
