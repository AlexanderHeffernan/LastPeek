name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lastpeek-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: lastpeek
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lastpeek_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lastpeek -d lastpeek_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://lastpeek:ci-only@127.0.0.1:5432/lastpeek_test
      MEDIA_DIR: ./data/test-media
      ORIGIN: http://127.0.0.1:4173
      PORT: 4173
      LASTPEEK_OWNER_ID: 11111111-1111-4111-8111-111111111111
      # Enable the mocked OAuth flow without real X credentials or API calls.
      X_CLIENT_ID: test-only-client-id
      X_CLIENT_SECRET: test-only-client-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --log-opts='--all --full-history' .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run check && npm test && npm run build
      - run: npm audit --audit-level=moderate
      - run: npm run db:migrate && npm run db:migrate
      - run: npx playwright install --with-deps chromium webkit
      - name: Test running production server
        shell: bash
        run: |
          X_API_BEARER_TOKEN=test-only-not-a-real-key npm start > /tmp/lastpeek-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..30}; do
            if curl -fsS "$ORIGIN/health"; then break; fi
            sleep 1
          done
          curl -fsS "$ORIGIN/health"
          npm run test:e2e
          TEST_BROWSER=webkit npm run test:e2e

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'AlexanderHeffernan/LastPeek'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/alexanderheffernan/lastpeek:latest
            ghcr.io/alexanderheffernan/lastpeek:${{ github.sha }}
          build-args: |
            ORIGIN=https://lastpeek.alexheffernan.dev
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
