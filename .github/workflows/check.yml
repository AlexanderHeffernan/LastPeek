name: Check
on:
  push:
  pull_request:
jobs:
  website:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lastpeek
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lastpeek_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lastpeek -d lastpeek_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://lastpeek:ci-only@127.0.0.1:5432/lastpeek_test
      MEDIA_DIR: ./data/test-media
      ORIGIN: http://127.0.0.1:4173
      PORT: 4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run check && npm test && npm run build
      - run: npm run db:migrate && npm run db:migrate
      - run: npx playwright install --with-deps chromium webkit
      - name: Test running production server
        run: |
          npm start > /tmp/lastpeek-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..30}; do curl -fsS "$ORIGIN/health" && break || sleep 1; done
          npm run test:e2e
          TEST_BROWSER=webkit npm run test:e2e
